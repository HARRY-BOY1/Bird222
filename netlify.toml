[build]
  publish = "messenger-client"

[[redirects]]
  from = "/socket.io/*"
  to = "https://messenger-server-xxxx.onrender.com/socket.io/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://messenger-server-xxxx.onrender.com/api/:splat"
  status = 200
  force = true
