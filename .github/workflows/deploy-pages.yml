name: Deploy Bird client to GitHub Pages
on:
  push:
    branches: [main]
    paths:\n      - 'messenger-client/**'\n      - 'config.js'\n      - 'index.html'\n      - 'js/**'\n      - 'css/**'\n      - 'assets/**'\n      - 'fonts/**'\n      - 'icons/**'\n      - 'manifest.json'\n      - 'service-worker.js'\n      - 'netlify.toml'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: messenger-client
      - id: deployment
        uses: actions/deploy-pages@v4

