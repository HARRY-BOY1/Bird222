name: Deploy Bird client to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'config.js'
      - 'js/**'
      - 'css/**'
      - 'assets/**'
      - 'fonts/**'
      - 'icons/**'
      - 'manifest.json'
      - 'service-worker.js'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage client files
        run: |
          rm -rf _site && mkdir _site
          cp -r index.html config.js manifest.json service-worker.js css js fonts icons assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
