name: Validate Bird gateway

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript
        run: |
          node --check server.js
          find public/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Start gateway smoke check
        run: |
          npm start > /tmp/bird-gateway.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 10); do curl -fsS http://127.0.0.1:${PORT}/health && exit 0 || sleep 1; done
          cat /tmp/bird-gateway.log
          exit 1
        env:
          UPSTREAM_URL: https://soakalshorja-production.up.railway.app
          PORT: 3900
